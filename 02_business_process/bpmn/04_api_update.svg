<text x="67" y="434" font-size="10.5" fill="#333">ALT-3: принцип «всё или ничего» действует на</text>
<text x="67" y="447" font-size="10.5" fill="#333">уровне строки (дата × категория × тариф):</text>
<text x="67" y="460" font-size="10.5" fill="#333">корректные строки принимаются, ошибочные</text>
<text x="67" y="473" font-size="10.5" fill="#333">отклоняются с кодом правила. Итоговый ответ</text>
<text x="67" y="486" font-size="10.5" fill="#333">содержит статус по каждой строке; ошибки — в</text>
<text x="67" y="499" font-size="10.5" fill="#333">формате application/problem+json (RFC 9457).</text>
<path d="M72,545 L60,545 L60,625 L72,625" fill="none" stroke="#222"/>
<text x="67" y="559" font-size="10.5" fill="#333">EXC-2: устаревшая запись (не совпал ETag / If-Match)</text>
<text x="67" y="572" font-size="10.5" fill="#333">отклоняется с 409 Conflict; данные не затираются, в</text>
<text x="67" y="585" font-size="10.5" fill="#333">ответе — актуальная версия и различия.</text>
