<path d="M72,110 L60,110 L60,200 L72,200" fill="none" stroke="#222"/>
<text x="67" y="124" font-size="10.5" fill="#333">BR-13: изменения по паре «объект × канал» группируются в пакет с</text>
<text x="67" y="137" font-size="10.5" fill="#333">окном 60 с (stop-sale — вне пакетирования). Повторы при сбое через 1,</text>
<text x="67" y="150" font-size="10.5" fill="#333">2, 4, 8 минут (4 попытки, всего 15 минут), идемпотентно. Канал без</text>
<text x="67" y="163" font-size="10.5" fill="#333">актуальных данных &gt; 15 минут закрывается (fail-safe), чтобы</text>
<text x="67" y="176" font-size="10.5" fill="#333">исключить продажу по устаревшему остатку (BG-3).</text>
